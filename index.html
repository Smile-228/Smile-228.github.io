    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
            color: #111;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }
        .wish-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .wish-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            gap: 15px;
        }
        .item-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
            flex-shrink: 0;
            background-color: #f8f9fa;
        }
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            min-width: 0;
        }
        .item-title {
            font-weight: 600;
            font-size: 16px;
        }
        .item-desc {
            font-size: 13px;
            color: #6c757d;
        }
        .btn-link {
            display: inline-block;
            background-color: #0070f3;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        .btn-link:hover {
            background-color: #0051b3;
        }

        /* КРАСИВЫЙ И ШИРОКИЙ ВЫПАДАЮЩИЙ СПИСОК МАГАЗИНОВ */
        .where-to-buy-dropdown {
            position: relative;
            display: inline-block;
        }
        .where-to-buy-dropdown summary {
            display: inline-block;
            background-color: #0070f3;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
            user-select: none;
            list-style: none;
        }
        .where-to-buy-dropdown summary::-webkit-details-marker {
            display: none;
        }
        .where-to-buy-dropdown summary:hover {
            background-color: #0051b3;
        }
        .where-to-buy-dropdown[open] summary {
            background-color: #004499;
        }
        
        /* Увеличенная ширина меню для красивого размещения значков */
        .shop-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 5px);
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            min-width: 200px; /* Увеличили, чтобы влез любой значок */
        }
        .shop-option {
            display: flex;
            align-items: center;
            gap: 10px; /* Отступ для будущих значков */
            padding: 10px 14px;
            text-decoration: none;
            color: #212529;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            transition: background 0.1s;
        }
        .shop-option:hover {
            background: #f1f3f5;
        }
        
    </style>
</head>
